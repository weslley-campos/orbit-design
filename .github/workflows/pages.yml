name: Deploy design workspace to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check workspace
        run: node design/check.mjs
      - name: Check the cloud service boundary
        run: node supabase/tests/service.test.mjs
      - name: Stamp asset URLs with the commit
        run: |
          cp -R design _site
          node .github/scripts/stamp-version.mjs _site "${GITHUB_SHA::12}"
      - name: Configure sign-in from repository settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            node -e 'const { SUPABASE_URL: url, SUPABASE_ANON_KEY: anonKey } = process.env;
              require("fs").writeFileSync("_site/cloud.config.js", `export default ${JSON.stringify({ url, anonKey })};\n`)'
            echo "Sign-in enabled for $SUPABASE_URL"
          else
            echo "SUPABASE_URL / SUPABASE_ANON_KEY not set: the site stays browser-only"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Applies new files in supabase/migrations to the Supabase database before the site that needs them goes live.
  # Skipped when the SUPABASE_DB_URL secret is not set. Migrations are written to be safe to re-run.
  migrate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Apply database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL not set: migrations are not applied automatically"
            exit 0
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
