    <path d="M 303.97 132.57 A 133 133 0 0 1 378.49 213.90 L 326.18 230.90 A 78 78 0 0 0 282.48 183.20 Z" fill="url(#expense)"></path>
    <path d="M 382.09 227.35 A 133 133 0 1 1 290.89 127.81" fill="none" stroke="#95DAF7" stroke-opacity=".34" stroke-width="1.5"></path>
