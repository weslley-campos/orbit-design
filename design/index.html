<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit design workspace</title>
<link rel="icon" href="assets/core-ui/drawable/ic_logo_spruce.svg" type="image/svg+xml">
<script>try { const t = localStorage.getItem('orbit.design.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="workspace.css">
<style id="orbit-base"></style>
<style id="orbit-overrides"></style>
</head>
<body>
<input id="import-file" type="file" accept="application/json,.json" aria-label="Import workspace.json" hidden>
<div id="notice" role="alert" hidden></div>
<div id="boot-error" role="alert" hidden></div>
<aside id="left" class="ws-side" aria-label="Pages and frames">
  <div class="ws-head">
    <button id="main-menu" class="ws-brand" aria-haspopup="menu" aria-label="Main menu" data-f="main-menu">
      <img class="ws-logo" alt="" width="24" height="24"><span class="ws-brand-text"><strong>Orbit design</strong><span id="save-status" role="status">Saved</span></span><span data-icon="chevron"></span>
    </button>
    <button id="toggle-left" class="ws-icon" aria-controls="left" aria-expanded="true" aria-label="Hide pages panel" data-icon="sidebar"></button>
  </div>
  <div id="left-body"></div>
</aside>
<div id="stage-wrap">
  <main id="canvas" aria-label="Canvas"></main>
  <div id="left-mini" class="ws-chip is-left" hidden>
    <img class="ws-logo" alt="Orbit design" width="22" height="22">
    <button id="show-left" class="ws-icon" aria-controls="left" aria-expanded="false" aria-label="Show pages panel" data-icon="sidebar"></button>
  </div>
  <div id="right-mini" class="ws-chip is-right" hidden>
    <button id="play-mini" class="ws-icon" aria-label="Play prototype" title="Play prototype" data-icon="play"></button>
    <button id="show-right" class="ws-icon" aria-controls="right" aria-expanded="false" aria-label="Show inspector panel" data-icon="sidebarRight"></button>
  </div>
  <div id="tools" class="ws-tools" role="toolbar" aria-label="View options"></div>
</div>
<aside id="right" class="ws-side" aria-label="Inspector">
  <div class="ws-head">
    <button id="play" class="ws-primary" data-icon="play">Play</button>
    <button id="toggle-right" class="ws-icon" aria-controls="right" aria-expanded="true" aria-label="Hide inspector panel" data-icon="sidebarRight"></button>
  </div>
  <div role="tablist" aria-label="Inspector tabs">
    <button id="tab-inspect" role="tab" aria-selected="true" aria-controls="panel">Inspect</button>
    <button id="tab-prototype" role="tab" aria-selected="false" aria-controls="panel">Prototype</button>
  </div>
  <div id="panel" role="tabpanel" aria-labelledby="tab-inspect" tabindex="0"></div>
</aside>
<script type="module" src="js/app.js" onerror="var b=document.getElementById('boot-error');b.hidden=false;b.textContent='A script failed to load. Open the browser console and serve design/ from http://localhost:4173.'"></script>
</body>
</html>
